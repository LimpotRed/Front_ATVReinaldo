<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Categoria</title>
    <link rel="stylesheet" href="../CSS/styles.css" />

    <!-- Estilo local igual ao de Pessoa/Patrimônio/Localização -->
    <style>
        body {
            background: #f5f5f5;
        }

        .gp-wrap {
            max-width: 1500px;
            margin: 40px auto;
            padding: 0 40px;
        }

        .gp-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
            justify-content: center;
        }

        .gp-card {
            background: #fff;
            border-radius: 12px;
            padding: 32px 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease;
        }

        .gp-card:hover {
            transform: translateY(-3px);
        }

        .gp-card h2 {
            margin-top: 0;
            font-size: 1.6rem;
            color: #222;
            border-bottom: 2px solid #2b7a2b;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .gp-card label {
            display: block;
            font-weight: 600;
            margin-top: 12px;
            color: #333;
        }

        .gp-card input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
            margin-top: 4px;
        }

        .gp-card button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 6px;
            background: #3aa63a;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background .3s ease;
        }

        .gp-card button:hover {
            background: #2f8e2f;
        }

        /* Lista vertical */
        #categoria-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #categoria-list li {
            background: #fff;
            border: 1px solid #e6e6e6;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 12px 0;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
            display: grid;
            gap: 6px;
        }

        .cat-line {
            display: flex;
            gap: 8px;
            align-items: baseline;
        }

        .cat-line strong {
            min-width: 140px;
            color: #333;
        }

        .cat-actions {
            margin-top: 6px;
            display: flex;
            justify-content: flex-end;
        }

        .cat-actions select {
            padding: 6px 8px;
        }

        @media (max-width: 1000px) {
            .gp-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .gp-card {
                padding: 28px;
            }

            .cat-line strong {
                min-width: 120px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR GLASS -->
    <header class="gp-navbar">
        <a class="gp-back-btn" href="home.html" aria-label="Voltar" title="Voltar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
            </svg>
        </a>
        <h1 class="gp-title">Cadastro de Categoria</h1>
        <div class="gp-spacer" aria-hidden="true"></div>
    </header>

    <div class="gp-wrap">
        <div class="gp-grid">
            <!-- FORMULÁRIO -->
            <section class="gp-card">
                <h2>Cadastrar / Editar Categoria</h2>
                <form id="categoria-form">
                    <input type="hidden" id="categoria-id" />

                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Ex.: Informática" required />

                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao" placeholder="Ex.: Equipamentos e acessórios de TI" required />

                    <button type="submit">Cadastrar</button>
                </form>
            </section>

            <!-- LISTA -->
            <section class="gp-card">
                <h2>Categorias Cadastradas</h2>
                <ul id="categoria-list"></ul>
            </section>
        </div>
    </div>

    <!-- POPUP -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <p>Tem certeza que deseja excluir esta categoria?</p>
            <button id="confirm-delete">Sim</button>
            <button id="cancel-delete">Não</button>
        </div>
    </div>

    <script src="../js/categoria.js"></script>
</body>

</html>
