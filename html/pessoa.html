<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Pessoa</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header>
    <h1>Cadastro de Pessoa</h1>
    <a href="home.html" style="color:#fff;text-decoration:underline;">← Voltar</a>
  </header>
    
    <section>
        <h2>Cadastrar Nova Pessoa</h2>
        <form id="pessoa-form">
            <input type="hidden" id="pessoa-id">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="departamento">Departamento:</label>
            <input type="text" id="departamento" name="departamento" required>
            
            <label for="cargo">Cargo:</label>
            <input type="text" id="cargo" name="cargo" required>
            
            <label for="ativo">Ativo:</label>
            <input type="checkbox" id="ativo" name="ativo" checked>

            <button type="submit">Cadastrar</button>
        </form>
    </section>

    <section>
        <h2>Lista de Pessoas</h2>
        <ul id="pessoa-list">
            <!-- Lista de pessoas será exibida aqui -->
        </ul>
    </section>

    <!-- Popup de confirmação -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <p>Tem certeza que deseja excluir a pessoa?</p>
            <button id="confirm-delete">Sim</button>
            <button id="cancel-delete">Não</button>
        </div>
    </div>

    <footer></footer>

    <script src="/js/script.js"></script>
</body>
</html>
